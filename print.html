<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <title>안드로이드 시험 대비 노트</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    @page { size: A4; margin: 14mm 13mm; }
    :root, :root[data-theme="dark"] { color-scheme: light; }
    body { background: #fff; color: #1d2433; font-size: 11pt; line-height: 1.55; }
    main { max-width: none; padding: 0; }
    .cover { padding: 30mm 0 12mm; border-bottom: 3px solid var(--brand); margin-bottom: 8mm; }
    .cover h1 { font-size: 26pt; }
    .cover p { color: var(--muted); }
    h2.sec { font-size: 15pt; margin: 8mm 0 3mm; padding-bottom: 2mm; border-bottom: 2px solid var(--brand); break-after: avoid; }
    .card { border: 0; margin: 0 0 4mm; }
    .topic h3 { font-size: 13.5pt; margin: 6mm 0 1mm; break-after: avoid; }
    .topic .src { color: var(--muted); font-size: 9.5pt; margin-bottom: 2mm; }
    .codeblock, .tbl-wrap, .tip, .diagram, .qa { break-inside: avoid; }
    pre { font-size: 8.8pt; white-space: pre-wrap; }
    table { font-size: 10pt; }
    .tbl-wrap { overflow: visible; }
    .qa { border: 1px solid var(--line); border-radius: 8px; padding: 3mm 4mm; margin: 0 0 3mm; }
    .qa .qn { color: var(--muted); font-size: 9pt; }
    .qa .qt { font-weight: 700; white-space: pre-wrap; margin: 1mm 0 2mm; }
    .qa .pts { margin: 0 0 2mm; padding-left: 5mm; color: var(--muted); font-size: 9.5pt; }
    .qa .model { font-size: 10pt; }
    .pb { break-before: page; }
    .foot { padding: 6mm 0 0; }
  </style>
</head>
<body>
  <main id="doc"></main>
  <script src="js/content.js"></script>
  <script src="js/render.js"></script>
  <script>
    (function () {
      const { esc, topicBody, cheatsheet } = Render;
      const { topics, questions } = STUDY;
      let h = `<div class="cover"><h1>안드로이드 시험 대비 노트</h1><p>모바일 프로그래밍 · 서술형 대비 요약 / 예상 문제 / 치트시트</p>
        <p style="font-size:10pt">시험 범위: 수업자료 1 p.56~ · 수업자료 2 p.9~11(라이프사이클), 기능/실습 2·3 · 수업자료 3 기능/실습 4, 5(레이아웃까지)<br>
        [보충] 표시는 강의자료 외 보충 설명입니다. 직접 정리한 노트이며 원본 강의자료가 아닙니다.</p></div>`;
      h += `<h2 class="sec">Part 1. 요약 노트</h2>`;
      topics.forEach((t, i) => {
        h += `<section class="topic"><h3>${i + 1}. ${t.title}</h3><div class="src">${t.source}</div>${topicBody(t)}</section>`;
      });
      h += `<h2 class="sec pb">Part 2. 서술형 예상 문제와 모범답안</h2>`;
      questions.forEach((q, i) => {
        const tp = topics.find((t) => t.id === q.topic);
        h += `<div class="qa"><div class="qn">Q${i + 1} · ${esc(tp.title.split(" — ")[0].split(" · ")[0])}</div>
          <div class="qt">${esc(q.q)}</div>
          <ul class="pts">${q.points.map((p) => `<li>${esc(p)}</li>`).join("")}</ul>
          <div class="model">${esc(q.answer)}</div></div>`;
      });
      h += `<h2 class="sec pb">Part 3. 치트시트</h2>${cheatsheet()}`;
      document.getElementById("doc").innerHTML = h;
    })();
  </script>
</body>
</html>
